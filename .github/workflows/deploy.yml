name: Deploy Emplio Cloud
# Ships emplio.app. Needs the private cloud/ folder and the server's keys, so it only runs in this repo, never in a fork.
on:
  push:
    branches: [production]
  workflow_dispatch: {}
# one deploy at a time, and never one stopped halfway
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'emplio-app/emplio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Fetch the private cloud folder
        env:
          CLOUD_DEPLOY_KEY: ${{ secrets.CLOUD_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CLOUD_DEPLOY_KEY" > ~/.ssh/cloud && chmod 600 ~/.ssh/cloud
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/cloud -o StrictHostKeyChecking=accept-new"
          # the cloud branch with the same name as this one, else main
          repo="git@github.com:${{ github.repository_owner }}/${{ github.event.repository.name }}-cloud.git"
          git clone -q --depth 1 --branch "${{ github.head_ref || github.ref_name }}" "$repo" cloud 2>/dev/null || git clone -q --depth 1 "$repo" cloud
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: bash cloud/deploy/deploy.sh
