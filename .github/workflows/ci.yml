name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      GITEA_URL: http://localhost:3399
      FILE_DIR: /tmp/emplio-files
      RUNNER_TOKEN: test-only
      COMPUTER_RUNNER_URL: http://localhost:4199
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Start Gitea for the tests
        run: |
          docker run -d --name gitea -p 3399:3000 -e GITEA__security__INSTALL_LOCK=true gitea/gitea:1.24
          for i in $(seq 1 30); do curl -fsS http://localhost:3399/api/v1/version >/dev/null 2>&1 && break; sleep 2; done
          token="$(docker exec -u git gitea gitea admin user create --config /data/gitea/conf/app.ini --admin --username employee0 --random-password --email bot@emplio.local --must-change-password=false --access-token | grep -oE '[0-9a-f]{40}' | head -n1)"
          echo "GITEA_TOKEN=$token" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: cd backend && bun run db:migrate && bun run test
      - run: bun test runner
  # the real thing: build every image and run it the way an install does, with none of the test settings above
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bash docker/smoke.sh
  # Emplio Cloud's own check: the same app with the private cloud/ folder in, its tests, and that nothing private
  # is in the public code. Only for pushes and pull requests from this repo: forks don't get the key, and don't need it.
  cloud:
    if: github.repository == 'emplio-app/emplio' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Fetch the private cloud folder
        env:
          CLOUD_DEPLOY_KEY: ${{ secrets.CLOUD_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CLOUD_DEPLOY_KEY" > ~/.ssh/cloud && chmod 600 ~/.ssh/cloud
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/cloud -o StrictHostKeyChecking=accept-new"
          # the cloud branch with the same name as this one, else main
          repo="git@github.com:${{ github.repository_owner }}/${{ github.event.repository.name }}-cloud.git"
          git clone -q --depth 1 --branch "${{ github.head_ref || github.ref_name }}" "$repo" cloud 2>/dev/null || git clone -q --depth 1 "$repo" cloud
      - run: bun install --frozen-lockfile && (cd cloud && bun install --frozen-lockfile)
      - run: bun cloud/deploy/leak-check.ts
      - run: bun run typecheck
      - run: bun run db:migrate
      - run: bash cloud/deploy/ci.sh
  # Only what passed the checks above is published. Installs download these instead of building.
  images:
    needs: [check, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [app, runner, computer, browser]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.image }}:latest
